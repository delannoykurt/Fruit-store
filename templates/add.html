<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ajouter un fruit</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h1>➕ Ajouter un fruit</h1>

        <form action="/add" method="POST">
            <label>Fruit :</label><br>
            <select name="fruit">
                <option value="0">🍌 Banane</option>
                <option value="1">🍒 Cerise</option>
                <option value="2">🍎 Pomme</option>
                <option value="3">🍓 Fraise</option>
                <option value="4">🍍 Grenade</option>
                <option value="5">🍑 Raisin</option>
                <option value="6">🥝 Mirtille</option>
            </select><br><br>

            <label>Origine :</label><br>
            <input type="text" name="from" required><br><br>

            <label>Poids (kg) :</label><br>
            <input type="number" name="weight" step="0.01" min="0.01" required><br><br>

            <button type="submit">Ajouter au stock</button>
        </form>

        <br><a href="/">⬅ Retour à l'accueil</a>
    </div>
</body>
</html>
