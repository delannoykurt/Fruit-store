<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Stock actuel</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h1>📦 Stock de fruits</h1>

        {{if .Items}}
            <ul>
                {{range .Items}}
                    <li>
                        <strong>{{index $.Fruits .Fruit}}</strong> de <em>{{.From}}</em>,
                        {{.Weight}} kg — stocké le {{.Date.Format "02/01/2006 15:04"}}
                    </li>
                {{end}}
            </ul>
        {{else}}
            <p>Pas encore de fruits en stock.</p>
        {{end}}

        <br><a href="/">⬅ Retour à l'accueil</a>
    </div>
</body>
</html>
